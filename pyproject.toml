[project]
name = "my-voc"
version = "0.1.0"
description = "个人词汇管理"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "pymongo>=4.19.0",
]

[tool.fastapi]
entrypoint = "main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["my_voc"]
